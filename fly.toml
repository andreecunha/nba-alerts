# fly.toml app configuration file generated for nba-alerts on 2026-10-25T04:53:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nba-alerts'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/subs.db'

[[mounts]]
  source = 'nba_dados'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
