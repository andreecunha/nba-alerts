app = "nba-alerts"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/subs.db"
  PORT = "8080"

# O bot responde "ok" nesta porta só para o Fly saber que está vivo.
# A máquina nunca se desliga sozinha (o bot tem de estar sempre ligado).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "nba_dados"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
